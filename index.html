<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Placement Ready C++</title>
    <meta name="description" content="A simple RPG-style progression tracker for C++ placement practice." />
    <link rel="stylesheet" href="style.css" />
    <script src="data/problems.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="Placement Ready C++ brand">
          <span class="brand-mark">🎮</span>
          <div>
            <p class="eyebrow">Programming Quest</p>
            <h1>Placement Ready C++</h1>
          </div>
        </div>

        <nav class="topnav" aria-label="Main navigation">
          <button class="nav-button active" data-view="dashboard">Dashboard</button>
          <button class="nav-button" data-view="skill-tree">Skill Tree</button>
          <button class="nav-button" data-view="progress">Progress</button>
          <button class="nav-button" data-view="settings">Settings</button>
        </nav>
      </header>

      <main id="app" aria-live="polite"></main>
    </div>
  </body>
</html>
